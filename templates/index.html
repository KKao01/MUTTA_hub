<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MUTTA · HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/main.css">
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-left" id="hubLogo">
    <span class="header-title">MUTTA · HUB</span>
    <span class="header-subtitle">BACKEND MANAGEMENT SYSTEM</span>
  </div>
  <div class="header-right">
    <div class="online-dot"></div>
    <span class="online-label">ONLINE</span>
    <span class="clock" id="clock">00:00:00</span>
  </div>
</div>

<!-- Body -->
<div class="body-wrap">

  <!-- Left Sidebar -->
  <div class="sidebar">

    <!-- 分單系統 card -->
    <div class="module-card" id="splitCard" onclick="openModal()">
      <div class="order-card-body">
        <div class="unified-title">分單系統</div>
        <div class="unified-sub">ORDER ROUTING</div>
      </div>
      <div class="unified-footer">
        <span class="unified-tag tag-green">超商</span>
        <span class="unified-tag tag-red">順豐</span>
      </div>
    </div>

    <!-- 客服助理 card -->
    <div class="module-card" onclick="window.open('https://muttacs-production.up.railway.app','_blank')">
      <div class="cs-card-body">
        <div class="unified-title">客服助理</div>
        <div class="unified-sub">CS ASSISTANT</div>
      </div>
      <div class="unified-footer">
        <span class="unified-tag tag-gold">AI 輔助</span>
      </div>
    </div>

    <!-- Coming Soon 2 -->
    <div class="coming-card" style="opacity:.4">
      <div class="coming-label">COMING SOON</div>
    </div>

    <!-- 快速連結 -->
    <div class="links-wrap" id="linksWrap"></div>

  </div>

  <!-- Right: Brand Gallery -->
  <div class="gallery-wrap">
    <div class="gallery-header">
      <span class="gallery-title">Brand Gallery</span>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>

</div>

<!-- Modal: 選擇模式 -->
<div class="modal-overlay" id="modeModal" style="display:none" onclick="closeModal(event)">
  <div class="modal-card">
    <div class="modal-title">分單系統</div>
    <div class="modal-sub">SELECT MODE</div>
    <div class="modal-btns">
      <div class="mode-btn mode-711" onclick="goMode('supermarket')">
        <div class="mode-icon">🏪</div>
        <div class="mode-name">超商模式</div>
        <div class="mode-desc">7-ELEVEN 取貨</div>
      </div>
      <div class="mode-btn mode-sf" onclick="goMode('sf')">
        <div class="mode-icon">📦</div>
        <div class="mode-name">順豐模式</div>
        <div class="mode-desc">SF EXPRESS 宅配</div>
      </div>
    </div>
    <div class="modal-close" onclick="closeModal()">CLOSE</div>
  </div>
</div>

<script src="/static/js/main.js"></script>
</body>
</html>
