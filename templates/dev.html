<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MUTTA · HUB — DEV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/main.css">
<link rel="stylesheet" href="/static/css/dev.css">
</head>
<body class="dev-body">

<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <div class="login-title">MUTTA · HUB</div>
    <div class="login-sub">開發者模式</div>
    <input type="password" id="pwdInput" class="login-input" placeholder="輸入密碼" autocomplete="current-password">
    <div class="login-err" id="loginErr"></div>
    <button class="login-btn" id="loginBtn">進入</button>
    <a href="/" class="login-back">← 返回主頁</a>
  </div>
</div>

<div class="dev-app" id="devApp" style="display:none">
  <div class="dev-header">
    <div style="display:flex;align-items:center;gap:10px">
      <span class="dev-badge">DEV</span>
      <span class="dev-header-title">MUTTA · HUB 開發者模式</span>
    </div>
    <div style="display:flex;gap:10px">
      <a href="/" class="dev-back-btn">← 返回主頁</a>
      <button class="dev-logout-btn" id="logoutBtn">登出</button>
    </div>
  </div>

  <div class="dev-body-wrap">

    <!-- 背景設定 -->
    <div class="dev-section">
      <div class="dev-section-title">背景設定</div>
      <div class="dev-section-desc">選擇主頁背景。影片請先用本機工具壓到 20MB 以下（建議 720p、≤10MB），否則會被擋下。</div>
      <div class="bg-type-row" id="bgTypeRow">
        <button class="bg-type-btn" data-bg="video">影片</button>
        <button class="bg-type-btn" data-bg="shader">Shader 同心圓</button>
        <button class="bg-type-btn" data-bg="none">無背景</button>
      </div>
      <div style="margin:14px 0 5px;font-size:12px;color:#8C8A78">暗化程度</div>
      <input type="range" id="bgDarken" min="0" max="80" value="50" style="width:100%">
      <button class="dev-save-btn" id="saveBg" style="margin-top:10px">儲存背景設定</button>
      <div class="dev-msg" id="bgMsg"></div>
      <div style="height:16px"></div>
      <div class="dev-section-desc">更換影片檔（會覆蓋目前的背景影片）</div>
      <button class="dev-save-btn" id="uploadBgBtn" style="background:#3A3828">⤒ 上傳新影片</button>
      <div class="dev-msg" id="bgUpMsg"></div>
    </div>

    <!-- 提示：版面編輯在主頁 -->
    <div class="dev-section">
      <div class="dev-section-title">版面編輯</div>
      <div class="dev-section-desc">字卡（3×7）與長條（1×5）的內容、位置、連結，請到主頁右上「✎ 編輯」用同一組密碼進入編輯。</div>
      <a href="/" class="dev-save-btn" style="display:inline-block;text-decoration:none;text-align:center">前往主頁編輯 →</a>
    </div>

    <!-- 修改密碼 -->
    <div class="dev-section">
      <div class="dev-section-title">修改密碼</div>
      <input type="password" id="newPwd"  class="dev-input" placeholder="新密碼（至少 6 碼）" style="margin-bottom:8px">
      <input type="password" id="newPwd2" class="dev-input" placeholder="確認新密碼">
      <div class="dev-msg" id="pwdMsg"></div>
      <button class="dev-save-btn" id="savePwd">更新密碼</button>
    </div>

  </div>
</div>

<script src="/static/js/dev.js"></script>
</body>
</html>
